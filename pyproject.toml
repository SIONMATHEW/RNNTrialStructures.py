[project]
name = "RNNTrialStructures"
version = "0.3.0"
authors = [{name="Roger Herikstad", email="rherikstad@proton.me"}]
description = "Python wrapper for the Julia package RNNTrialStructures"
requires-python = ">=3.10"
dependencies = ["juliacall>=0.9.24,<0.10", "numpy>=1.26,<3"]

[project.urls]
Repository = "https://github.com/SIONMATHEW/RNNTrialStructures.py"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

